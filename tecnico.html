le { margin-bottom: 5px; } .leaflet-control-scale-line { border: 2px solid #777; border-top: none; line-height: 1.1; padding: 2px 5px 1px; white-space: nowrap; -moz-box-sizing: border-box; box-sizing: border-box; background: rgba(255, 255, 255, 0.8); text-shadow: 1px 1px #fff; } .leaflet-control-scale-line:not(:first-child) { border-top: 2px solid #777; border-bottom: none; margin-top: -2px; } .leaflet-control-scale-line:not(:first-child):not(:last-child) { border-bottom: 2px solid #777; } .leaflet-touch .leaflet-control-attribution, .leaflet-touch .leaflet-control-layers, .leaflet-touch .leaflet-bar { box-shadow: none; } .leaflet-touch .leaflet-control-layers, .leaflet-touch .leaflet-bar { border: 2px solid rgba(0,0,0,0.2); background-clip: padding-box; } .leaflet-popup { position: absolute; text-align: center; margin-bottom: 20px; } .leaflet-popup-content-wrapper { padding: 1px; text-align: left; border-radius: 12px; } .leaflet-popup-content { margin: 13px 24px 13px 20px; line-height: 1.3; font-size: 13px; font-size: 1.08333em; min-height: 1px; } .leaflet-popup-content p { margin: 17px 0; margin: 1.3em 0; } .leaflet-popup-tip-container { width: 40px; height: 20px; position: absolute; left: 50%; margin-top: -1px; margin-left: -20px; overflow: hidden; pointer-events: none; } .leaflet-popup-tip { width: 17px; height: 17px; padding: 1px; margin: -10px auto 0; pointer-events: auto; -webkit-transform: rotate(45deg); -moz-transform: rotate(45deg); -ms-transform: rotate(45deg); transform: rotate(45deg); } .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: white; color: #333; box-shadow: 0 3px 14px rgba(0,0,0,0.4); } .leaflet-container a.leaflet-popup-close-button { position: absolute; top: 0; right: 0; border: none; text-align: center; width: 24px; height: 24px; font: 16px/24px Tahoma, Verdana, sans-serif; color: #757575; text-decoration: none; background: transparent; } .leaflet-container a.leaflet-popup-close-button:hover, .leaflet-container a.leaflet-popu t:before { left: 0; margin-left: -12px; border-right-color: #fff; } @media print { .leaflet-control { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
/* Layout: una sola columna de teléfono (máx. 440 px). Barra superior fija, acción principal fija abajo,
   secciones apiladas en el orden en que el técnico las necesita: llegar, ver la zona, entender, trabajar, cerrar. */
:root{
  --bg:#F2F5F4; --panel:#FFFFFF; --sunk:#E6ECEA; --ink:#0D1A17; --ink2:#52675F; --line:#D3DEDA;
  --agua:#1B6CD1; --net:#BF2F86; --alert:#8A5D00; --alert-bg:#FFF2CC; --alert-line:#D89A00;
  --ok:#1C8550; --ok-bg:#DDF3E7; --crit:#C42B22; --crit-bg:#FDE3E1;
  --poi:#22312D; --poi-ink:#FFFFFF; --land:#E4EAE8; --block:#F8FAF9; --street:#C9D5D1; --avenue:#A9BBB5;
  --scrim:rgba(13,26,23,.45); --tile-filter:none;
  --font:Archivo,"Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070D0C; --panel:#0D1614; --sunk:#111E1B; --ink:#E8F1EE; --ink2:#8CA39C; --line:#1E302C;
  --agua:#5AA2FF; --net:#FF79C6; --alert:#FFC247; --alert-bg:#33280A; --alert-line:#FFC247;
  --ok:#5FD39A; --ok-bg:#0F2A1E; --crit:#FF6B5E; --crit-bg:#3A1411;
  --poi:#E8F1EE; --poi-ink:#070D0C; --land:#0A1312; --block:#111E1B; --street:#1F322E; --avenue:#3D5850;
  --scrim:rgba(0,0,0,.6); --tile-filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.95) saturate(.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070D0C; --panel:#0D1614; --sunk:#111E1B; --ink:#E8F1EE; --ink2:#8CA39C; --line:#1E302C;
  --agua:#5AA2FF; --net:#FF79C6; --alert:#FFC247; --alert-bg:#33280A; --alert-line:#FFC247;
  --ok:#5FD39A; --ok-bg:#0F2A1E; --crit:#FF6B5E; --crit-bg:#3A1411;
  --poi:#E8F1EE; --poi-ink:#070D0C; --land:#0A1312; --block:#111E1B; --street:#1F322E; --avenue:#3D5850;
  --scrim:rgba(0,0,0,.6); --tile-filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.95) saturate(.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--sunk);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg)}
@media (min-width:480px){.app{border-inline:1px solid var(--line)}}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:56px}
.back{border:0;background:none;padding:10px 8px;margin-left:-8px;display:flex;align-items:center;gap:2px;color:var(--ink2);font-size:15px}
.back svg{width:18px;height:18px}
.top h1{font-size:17px;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pill.asignada{color:var(--ink2)}
.pill.camino{color:var(--panel);background:var(--ink);border-color:var(--ink)}
.pill.sitio{color:var(--alert)}
.pill.resuelta{color:var(--ok)}

/* lista */
.lhead{background:var(--panel);padding:16px;border-bottom:1px solid var(--line)}
.tech{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-stretch:112%;flex:none}
.tech b{display:block;font-size:17px}
.tech .sub{font-size:13px;color:var(--ink2)}
.tech .r{margin-left:auto;text-align:right;font-size:13px}
.onduty{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.onduty::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sim{display:inline-block;margin-top:2px;border:1px dashed var(--line);border-radius:3px;padding:1px 6px;color:var(--ink2);font-size:11.5px}
.sumline{margin-top:14px;font-size:14px;color:var(--ink2)}
.sumline b{color:var(--ink);font-size:16px}
.cards{list-style:none;margin:0;padding:14px 16px 28px;display:flex;flex-direction:column;gap:10px}
.lgroup{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding-top:8px}
.card{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 14px 14px 20px;
  position:relative;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.card.alta::before{background:var(--crit)} .card.media::before{background:var(--alert-line)}
.card.resuelta{opacity:.7} .card.resuelta::before{background:var(--ok)}
.card .l1{display:flex;align-items:center;gap:8px;font-size:13px}
.card .l1 .pill{margin-left:auto}
.card .s{font-size:18px;font-weight:800;font-stretch:108%;line-height:1.2}
.card .a{font-size:14.5px}
.card .m{font-size:13px;color:var(--ink2)}

/* detalle */
.svc{font-weight:700} .svc.agua{color:var(--agua)} .svc.internet{color:var(--net)}
.prio{font-weight:700;font-size:12px;padding:2px 8px;border-radius:3px;white-space:nowrap}
.prio.alta{background:var(--crit-bg);color:var(--crit)} .prio.media{background:var(--alert-bg);color:var(--alert)} .prio.baja{background:var(--sunk);color:var(--ink2)}
.banner{background:var(--alert-bg);padding:10px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.banner b{color:var(--alert)}
.hero{background:var(--panel);padding:16px 16px 18px;border-bottom:1px solid var(--line)}
.hero .tags{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.hero .sint{font-size:28px;font-weight:800;font-stretch:110%;line-height:1.08;letter-spacing:-.01em;margin:10px 0 2px;text-wrap:balance}
.hero .why{font-size:14px;color:var(--crit);font-weight:600}
.addrbox{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.addrbox .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.addrbox .addr{font-size:19px;font-weight:700;line-height:1.25;user-select:all}
.addrbox .ref{color:var(--ink2);font-size:14px}
.eta{margin-top:8px;font-size:14px}
.eta b{font-weight:700}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:6px;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);font-weight:700;text-decoration:none;font-size:15px;text-align:center;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

.sec{padding:20px 16px;border-bottom:1px solid var(--line)}
.sec>h2{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.sec>h2 .cnt{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.sec>h2.fh{margin:-10px 0}
.fold{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0;border:0;background:none;
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left}
.fold .cnt{margin-left:auto}
.fold svg{width:20px;height:20px;flex:none;color:var(--ink);transition:transform .2s}
.fold[aria-expanded="true"] svg{transform:rotate(180deg)}
#reclBody{margin-top:16px}
.sec h3{font-size:14px;font-weight:700;margin:18px 0 4px}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps li.done::before{background:var(--ink)}
.steps li.now::before{background:var(--alert-line)}
.steps li b{color:var(--ink);font-size:12.5px;line-height:1.2}
.steps li:not(.done):not(.now) b{color:var(--ink2);font-weight:500}

/* mapa */
.zwrap{position:relative;isolation:isolate;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:300px;max-width:100%;background:var(--land)}
#zmap{position:absolute;inset:0;z-index:0;background:var(--land);font:inherit}
.zwrap.full{position:fixed;inset:0;z-index:60;border-radius:0;height:auto;border:0}
.zbtn{position:absolute;z-index:500;top:8px;right:8px;min-height:36px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}

         {h:o.t.asignada,txt:`${o.nota.de} te asignó la orden${o.reclamos.length>1?` con ${o.reclamos.length} reclamos agrupados`:""}`}];
  if(o.t.camino) o.log.push({h:o.t.camino,txt:"Saliste hacia el lugar",me:1});
  o.reclamos.filter(c=>c.prio).forEach(c=>o.log.push({h:c.hora,txt:`Se sumó el reclamo de ${c.socio} (prioridad alta)`}));
  o.log.sort((a,b)=>a.h-b.h);
});

/* ================= mapa de la zona ================= */
function buildMap(o){
  if(map){map.remove();map=null;}
  const el=$("#zmap"); if(!el) return;
  if(!window.L){el.innerHTML='<p class="nomap">No se pudo cargar el mapa. Revisá la conexión y volvé a abrir la orden.</p>';return;}
  const z=zona(o), all=[o,...o.reclamos,...o.poi,...o.otros];
  const R=Math.max(240,...all.map(p=>metros(o,p)+(p.r||0)))+30;
  const dLat=R/111320, dLng=R/(111320*Math.cos(o.lat*Math.PI/180));
  const b=curBounds=L.latLngBounds([o.lat-dLat,o.lng-dLng],[o.lat+dLat,o.lng+dLng]);
  const m=map=L.map(el,{zoomControl:false,scrollWheelZoom:false,zoomSnap:.25,maxBoundsViscosity:1,attributionControl:true});
  m.fitBounds(b); m.setMaxBounds(b.pad(.35)); m.setMinZoom(m.getZoom()-.5); m.setMaxZoom(18.5);
  m.attributionControl.setPrefix(false);
  L.control.zoom({position:"bottomright"}).addTo(m);
  const tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,className:"tiles",attribution:"© OpenStreetMap"}).addTo(m);
  let ok=false; tiles.on("tileload",()=>ok=true);
  const fb=()=>{if(ok||m!==map||m._esq) return; m._esq=true; m.removeLayer(tiles); esquema(m,o,b.pad(.35)); $("#znote").hidden=false;};
  tiles.on("tileerror",fb); setTimeout(fb,5000);

  const go=k=>{cerrarFicha();const row=document.getElementById("k-"+k); if(!row) return; if(row.closest("#reclBody")) setFold(true);
    if($("#zwrap").classList.contains("full")) return; row.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"}); flash(row);};
  const tip=(mk,txt)=>mk.bindTooltip(txt,{direction:"top",offset:[0,-12]});

  // zona afectada
  if(o.reclamos.length>1) L.circle(z.cen,{radius:z.r,className:"zone "+o.servicio,weight:1.5,dashArray:"6 5",fillOpacity:.12,interactive:false}).addTo(m);
  // puntos de interés
  o.poi.forEach((p,i)=>{
    if(p.tipo==="demanda") L.circle(p,{radius:p.r,className:"zone demand",weight:1.5,dashArray:"2 5",fillOpacity:.1,interactive:false}).addTo(m);
    const mk=L.marker(p,{icon:L.divIcon({className:"pin",iconSize:[22,22],iconAnchor:[11,11],html:poiBadge(p.tipo)}),keyboard:false}).addTo(m);
    mk.on("click",e=>{L.DomEvent.stop(e);ficha("p",p);});
  });
  // otros reclamos
  o.otros.forEach((p,i)=>{
    const res=/resuelto/i.test(p.estado);
    const mk=L.marker(p,{icon:L.divIcon({className:"pin",iconSize:[20,20],iconAnchor:[10,10],html:svgOf(p.servicio,20,7,res?ATTR.cerrado():ATTR.otro(p.servicio))}),keyboard:false}).addTo(m);
    mk.on("click",e=>{L.DomEvent.stop(e);ficha("o",p);});
  });
  // reclamos de esta orden
  o.reclamos.forEach((c,i)=>{
    if(metros(o,c)<15) return;
    const mk=L.marker(c,{icon:L.divIcon({className:"pin",iconSize:[20,20],iconAnchor:[10,10],html:svgOf(o.servicio,20,7,ATTR.propio(o.servicio))}),keyboard:false}).addTo(m);
    tip(mk,`${c.socio} · ${hhmm(c.hora)}`); mk.on("click",()=>go("r"+i));
  });
  // dirección de la orden
  const tk=L.marker(o,{zIndexOffset:1000,keyboard:false,icon:L.divIcon({className:"pin",iconSize:[34,34],iconAnchor:[17,17],html:targetSvg(o.servicio)})}).addTo(m);
  tip(tk,o.dir);
  m.on("click",cerrarFicha);
}
function cerrarFicha(){const c=$("#zcard"); if(c){c.hidden=true;c.innerHTML="";}}
function ficha(tipo,p){
  const o=cur, c=$("#zcard"), d=fmtD(metros(o,p));
  if(tipo==="p"){
    c.innerHTML=`<div class="zc-h">${poiBadge(p.tipo)}<div><b>${esc(p.nombre)}</b><span class="num">a ${d} de la dirección</span></div></div>
      <p>${esc(p.det)}${p.con?` Afecta a unas ${p.con} conexiones.`:""}</p>${p.warn?`<p class="warn">${esc(p.warn)}</p>`:""}`;
  }else{
    const res=/resuelto/i.test(p.estado);
    c.innerHTML=`<div class="zc-h">${svgOf(p.servicio,22,8,res?ATTR.cerrado():ATTR.otro(p.servicio))}<div><b class="num">#${p.id} · ${SVC[p.servicio]}: ${esc(p.sintoma)}</b><span class="num">a ${d} de la dirección</span></div></div>
      <p><b style="color:var(--ink)">${esc(p.estado)}.</b> ${esc(p.det)}</p>`;
  }
  c.insertAdjacentHTML("afterbegin",'<button class="x" aria-label="Cerrar">×</button>');
  c.querySelector(".x").onclick=cerrarFicha; c.hidden=false;
}
/* Plano dibujado cuando las teselas no cargan: manzanas de 100 m y la avenida de referencia */
function esquema(m,o,b){
  const n=b.getNorth(),s=b.getSouth(),w=b.getWest(),e=b.getEast();
  const Wm=metros({lat:n,lng:w},{lat:n,lng:e}), Hm=metros({lat:n,lng:w},{lat:s,lng:w});
  const X=lng=>(lng-w)/(e-w)*Wm, Y=lat=>(n-lat)/(n-s)*Hm, mod=v=>((v%100)+100)%100;
  const ax=X(o.lng), ay=Y(o.lat), id="blk"+o.id, right=ax<Wm*.6;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${Wm.toFixed(0)} ${Hm.toFixed(0)}`); svg.setAttribute("preserveAspectRatio","none");
  svg.innerHTML=`<defs><pattern id="${id}" width="100" height="100" patternUnits="userSpaceOnUse" x="${mod(ax-50).toFixed(1)}" y="${mod(ay).toFixed(1)}">
      <rect width="100" height="100" fill="var(--street)"/><rect x="7" y="7" width="86" height="86" rx="4" fill="var(--block)"/></pattern></defs>
    <rect width="${Wm}" height="${Hm}" fill="url(#${id})"/>
    <rect x="0" y="${ay-14}" width="${Wm}" height="28" fill="var(--avenue)"/>
    <text x="${(Wm*.04).toFixed(0)}" y="${(ay+14+Wm/30).toFixed(0)}" font-size="${(Wm/34).toFixed(0)}" font-weight="700" fill="var(--ink)" stroke="var(--avenue)" stroke-width="${(Wm/160).toFixed(1)}" paint-order="stroke" text-anchor="start">${esc(o.avenida)}</text>`;
  L.svgOverlay(svg,b,{interactive:false}).addTo(m).bringToBack();
}
function toggleFull(){
  const w=$("#zwrap"), on=!w.classList.contains("full");
  w.classList.toggle("full",on); document.body.style.overflow=on?"hidden":"";
  $("#zfull").textContent=on?"Cerrar mapa":"Ampliar"; $("#zfull").setAttribute("aria-pressed",on);
  if(!map) return;
  setTimeout(()=>{map.invalidateSize(); map.setMinZoom(0); map.fitBounds(curBounds); map.setMinZoom(map.getZoom()-.5);
    on?map.scrollWheelZoom.enable():map.scrollWheelZoom.disable();},60);
}

  apoyo:o=>`<form id="f">
    <h2 id="sheetTitle">Pedir apoyo</h2>
    <p class="lead">El pedido le llega a la mesa con la ubicación de la orden #${o.id}.</p>
    <fieldset class="field"><legend>Qué necesitás</legend>${radio("atipo",["Otra cuadrilla","Retroexcavadora","Camión cisterna","Materiales"],"")}</fieldset>
    <div class="field"><label for="adet">Detalle</label><textarea id="adet" placeholder="Ej.: la pérdida está bajo la calzada, hay que romper unos 2 m de asfalto"></textarea></div>
    <p class="err" id="ferr" hidden></p>
    <div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">Enviar pedido</button></div></form>`,
  nota:o=>`<form id="f">
    <h2 id="sheetTitle">Agregar nota</h2>
    <p class="lead">Queda en la bitácora de la orden y la ve la mesa.</p>
    <div class="field"><label for="ntxt">Nota</label><textarea id="ntxt" placeholder="Ej.: el socio de Los Talas 132 no estaba, dejé aviso en la puerta"></textarea></div>
    <p class="err" id="ferr" hidden></p>
    <div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">Guardar nota</button></div></form>`,
  cierre:o=>`<form id="f" novalidate>
    <h2 id="sheetTitle">Cerrar orden #${o.id}</h2>
    <p class="lead">La mesa marca el incidente como resuelto y avisa a ${o.reclamos.length===1?"la persona que reclamó":`los ${o.reclamos.length} socios que reclamaron`}.</p>
    <div class="field"><label for="ccausa">Causa encontrada</label>
      <select id="ccausa"><option value="">Elegí una opción</option>${CAUSAS[o.servicio].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
    <div class="field"><label for="ctrab">Trabajo realizado</label>
      <textarea id="ctrab" placeholder="Ej.: cambio de abrazadera en la unión del 14/08, purga y prueba de presión"></textarea></div>
    <fieldset class="field"><legend>Materiales usados</legend>
      <div class="chk">${o.materiales.map((m,i)=>`<label><input type="checkbox" id="cm${i}" value="${esc(m)}" ${o.mat.has(i)?"checked":""}><span>${esc(m)}</span></label>`).join("")}</div></fieldset>
    <div class="field"><label for="cfotos">Fotos del trabajo</label>
      <input type="file" id="cfotos" accept="image/*" capture="environment" multiple><div class="photos" id="cph"></div></div>
    <div class="field">
      <label class="inl"><input type="checkbox" id="cverif"><span>Un socio confirmó que el servicio volvió</span></label>
      <label class="inl"><input type="checkbox" id="cpend"><span>Queda trabajo pendiente (vereda, bacheo, nueva visita)</span></label></div>
    <p class="err" id="ferr" hidden></p>
    <div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">Cerrar orden</button></div></form>`
};
let lastFocus=null;
function openSheet(kind){
  const o=cur; lastFocus=document.activeElement;
  $("#sheetBody").innerHTML=SHEETS[kind](o); $("#sheet").hidden=false; document.body.style.overflow="hidden";
  const f=$("#f"), err=msg=>{const e=$("#ferr"); e.textContent=msg; e.hidden=false;};
  f.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  setTimeout(()=>{const first=f.querySelector("select,textarea,input:not([type=radio]):not([type=checkbox]):not([type=file])"); if(first) first.focus();},30);
  if(kind==="cierre"){
    $("#cfotos").onchange=e=>{$("#cph").innerHTML=""; [...e.target.files].forEach(fl=>{const im=document.createElement("img");im.alt="Foto adjunta";im.src=URL.createObjectURL(fl);$("#cph").appendChild(im);});};
  }
  f.onsubmit=e=>{
    e.preventDefault();
    if(kind==="corte"){
      const sel=$("#cvalv").selectedOptions[0], dur=f.cdur.value, hrs={"1 hora":1,"2 horas":2,"4 horas":4}[dur];
      o.corte={valv:sel.value,con:+sel.dataset.con,hasta:hrs?new Date(Date.now()+hrs*3600000):null};
      log(o,`Avisaste corte en ${sel.value} (${dur.toLowerCase()}): ${$("#cmot").value}`); renderCorte(); toast("Aviso enviado. La mesa informa a los socios");
    }
    if(kind==="apoyo"){
      const t=f.atipo.value; if(!t) return err("Elegí qué tipo de apoyo necesitás.");
      const d=$("#adet").value.trim(); log(o,`Pediste apoyo: ${t}${d?`. ${d}`:""}`); toast("Pedido enviado a la mesa");
    }
    if(kind==="nota"){
      const d=$("#ntxt").value.trim(); if(!d) return err("Escribí la nota antes de guardarla.");
      log(o,`Nota: ${d}`); toast("Nota guardada");
    }
    if(kind==="cierre"){
      const causa=$("#ccausa").value, trab=$("#ctrab").value.trim();
      if(!causa) return err("Elegí la causa que encontraste."); if(trab.length<5) return err("Contá brevemente qué trabajo hiciste.");
      const nf=$("#cfotos").files.length, mats=[...f.querySelectorAll(".chk input:checked")].map(x=>x.value);
      o.estado="resuelta"; o.t.resuelta=new Date();
      o.cierre={causa,trab,mats,fotos:nf,verif:$("#cverif").checked,pend:$("#cpend").checked};
      if(o.corte){log(o,`Servicio restablecido en ${o.corte.valv}`); o.corte=null; renderCorte();}
      log(o,`Cerraste la orden. Causa: ${causa.toLowerCase()}. ${trab}${mats.length?` Materiales: ${mats.join(", ")}.`:""}${nf?` ${nf} ${nf===1?"foto":"fotos"}.`:""}`);
      if(o.cierre.pend) log(o,"Queda trabajo pendiente: la mesa programa una nueva visita");
      renderStatus(); toast(`Orden #${o.id} cerrada. La mesa avisa a ${o.reclamos.length===1?"la socia":`los ${o.reclamos.length} socios`}`);
    }
    closeSheet();
  };
}
function closeSheet(){
  $("#sheet").hidden=true; $("#sheetBody").innerHTML="";
  document.body.style.overflow=$("#zwrap")&&$("#zwrap").classList.contains("full")?"hidden":"";
  if(lastFocus&&lastFocus.isConnected) lastFocus.focus();
}
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key!=="Escape") return;
  if(!$("#sheet").hidden) closeSheet(); else if($("#zcard")&&!$("#zcard").hidden) cerrarFicha(); else if($("#zwrap")&&$("#zwrap").classList.contains("full")) toggleFull();});

/* ================= inicio ================= */
const clock=()=>$("#clock").textContent=hhmm(new Date());
clock(); setInterval(clock,15000);
renderList(); openOrder(142);
</script>
